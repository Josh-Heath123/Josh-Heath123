<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 637" width="480" height="637" xml:space="preserve" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">NAME: josh, builds a feature end to end, then stays to keep it running. Final-year BSc Computer Science student at the University of Pretoria, graduating at the end of 2026. I work across the full stack with a focus on data: I build the pipeline, the API and the interface for a feature, then take it to production and look after it once real people use it. Comfortable from low-level systems and networking up to production web apps. I care about the unglamorous parts too: tests worked out by hand, migrations that round-trip, deploys that stay up. Away from the keyboard: gym and gaming. I like a challenge, physical, recreational or mental. Open to internships and graduate roles.</title><defs><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre;font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lab{font-weight:700;fill:#a08ae8;letter-spacing:2px}.h{font-weight:700;fill:#efe8da}.b{fill:#efe8da}.t{fill:#cfc8bb}.m{fill:#8f889c}.a{fill:#a08ae8}.d{fill:#8a83a3}</style><radialGradient id="g" cx="78%" cy="18%" r="85%"><stop offset="0" stop-color="#17141f"/><stop offset="1" stop-color="#0c0b10"/></radialGradient><pattern id="s" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".02"/></pattern><clipPath id="c"><rect width="480" height="637" rx="14"/></clipPath></defs><g clip-path="url(#c)"><rect width="480" height="637" fill="url(#g)"/><text class="lab" x="24.0" y="44.0" font-size="11">NAME</text><text class="h" x="24.0" y="70.0" font-size="15">josh</text><text class="t" x="60.0" y="70.0" font-size="15"> — builds a feature end to</text><text class="t" x="24.0" y="92.0" font-size="15">end, then stays to keep it running</text><text class="lab" x="24.0" y="132.0" font-size="11">SYNOPSIS</text><text class="h" x="24.0" y="158.0" font-size="13.8">josh </text><text class="a" x="65.4" y="158.0" font-size="13.8">[--pipeline] [--api] [--interface]</text><text class="b" x="24.0" y="180.0" font-size="13.8">     --to production </text><text class="m" x="197.9" y="180.0" font-size="13.8">problem</text><text class="lab" x="24.0" y="220.0" font-size="11">DESCRIPTION</text><text class="t" x="24.0" y="246.0" font-size="15">Final-year BSc Computer Science student at the</text><text class="t" x="24.0" y="268.5" font-size="15">University of Pretoria, graduating at the end</text><text class="t" x="24.0" y="291.0" font-size="15">of 2026. I work across the full stack with a</text><text class="t" x="24.0" y="313.5" font-size="15">focus on data: I build the pipeline, the API</text><text class="t" x="24.0" y="336.0" font-size="15">and the interface for a feature, then take it</text><text class="t" x="24.0" y="358.5" font-size="15">to production and look after it once real</text><text class="t" x="24.0" y="381.0" font-size="15">people use it.</text><text class="t" x="24.0" y="415.5" font-size="15">Comfortable from low-level systems and</text><text class="t" x="24.0" y="438.0" font-size="15">networking up to production web apps. I care</text><text class="t" x="24.0" y="460.5" font-size="15">about the unglamorous parts too: tests worked</text><text class="t" x="24.0" y="483.0" font-size="15">out by hand, migrations that round-trip,</text><text class="t" x="24.0" y="505.5" font-size="15">deploys that stay up.</text><text class="t" x="24.0" y="540.0" font-size="15">Away from the keyboard: gym and gaming. I like</text><text class="t" x="24.0" y="562.5" font-size="15">a challenge, physical, recreational or mental.</text><circle cx="29" cy="592.0" r="4.5" fill="#a08ae8"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text class="b" x="42.0" y="597.0" font-size="14.25">Open to internships and graduate roles.</text><rect width="480" height="637" fill="url(#s)"/></g><rect x=".5" y=".5" width="479" height="636" rx="13.5" fill="none" stroke="#2a2537"/></svg>
