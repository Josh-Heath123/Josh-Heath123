<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 421" width="960" height="421" xml:space="preserve" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">NAME: josh, builds a feature end to end, then stays to keep it running. Final-year BSc Computer Science student at the University of Pretoria, graduating at the end of 2026. I work across the full stack with a focus on data: I build the pipeline, the API and the interface for a feature, then take it to production and look after it once real people use it. Comfortable from low-level systems and networking up to production web apps. I care about the unglamorous parts too: tests worked out by hand, migrations that round-trip, deploys that stay up. Away from the keyboard: gym and gaming. I like a challenge, physical, recreational or mental. Open to internships and graduate roles.</title><defs><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre;font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lab{font-weight:700;fill:#a08ae8;letter-spacing:2px}.h{font-weight:700;fill:#efe8da}.b{fill:#efe8da}.t{fill:#cfc8bb}.m{fill:#8f889c}.a{fill:#a08ae8}.d{fill:#8a83a3}</style><radialGradient id="g" cx="78%" cy="18%" r="85%"><stop offset="0" stop-color="#17141f"/><stop offset="1" stop-color="#0c0b10"/></radialGradient><pattern id="s" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".02"/></pattern><clipPath id="c"><rect width="960" height="421" rx="14"/></clipPath></defs><g clip-path="url(#c)"><rect width="960" height="421" fill="url(#g)"/><text class="lab" x="52.0" y="62.0" font-size="12">NAME</text><text class="h" x="214.0" y="62.0" font-size="15">josh</text><text class="t" x="250.0" y="62.0" font-size="15"> — builds a feature end to end, then stays to keep it running</text><text class="lab" x="52.0" y="106.0" font-size="12">SYNOPSIS</text><text class="h" x="214.0" y="106.0" font-size="15">josh </text><text class="a" x="259.0" y="106.0" font-size="15">[--pipeline] [--api] [--interface] </text><text class="b" x="574.0" y="106.0" font-size="15">--to production </text><text class="m" x="718.0" y="106.0" font-size="15">problem</text><text class="lab" x="52.0" y="150.0" font-size="12">DESCRIPTION</text><text class="t" x="214.0" y="150.0" font-size="14.5">Final-year BSc Computer Science student at the University of Pretoria,</text><text class="t" x="214.0" y="171.8" font-size="14.5">graduating at the end of 2026. I work across the full stack with a focus on</text><text class="t" x="214.0" y="193.5" font-size="14.5">data: I build the pipeline, the API and the interface for a feature, then</text><text class="t" x="214.0" y="215.2" font-size="14.5">take it to production and look after it once real people use it.</text><text class="t" x="214.0" y="249.0" font-size="14.5">Comfortable from low-level systems and networking up to production web apps.</text><text class="t" x="214.0" y="270.8" font-size="14.5">I care about the unglamorous parts too: tests worked out by hand, migrations</text><text class="t" x="214.0" y="292.5" font-size="14.5">that round-trip, deploys that stay up.</text><text class="t" x="214.0" y="326.2" font-size="14.5">Away from the keyboard: gym and gaming. I like a challenge, physical,</text><text class="t" x="214.0" y="348.0" font-size="14.5">recreational or mental.</text><circle cx="219" cy="376.75" r="4.5" fill="#a08ae8"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text class="b" x="232.0" y="381.8" font-size="14.5">Open to internships and graduate roles.</text><rect width="960" height="421" fill="url(#s)"/></g><rect x=".5" y=".5" width="959" height="420" rx="13.5" fill="none" stroke="#2a2537"/></svg>
